<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Question Generator</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #e2e0da; --accent: #1d4ed8; --accent-ink: #ffffff;
    --demo-bg: #eff6ff; --demo-line: #bfdbfe; --err: #b91c1c;
    --tag-beh: #0f766e; --tag-pm: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe7; --muted: #a09e98;
      --line: #36352f; --accent: #60a5fa; --accent-ink: #0b1220;
      --demo-bg: #14213a; --demo-line: #1e3a8a; --err: #f87171;
      --tag-beh: #5eead4; --tag-pm: #c4b5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 16px;
  }
  .bar .field { flex: 1 1 320px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  textarea { resize: vertical; min-height: 260px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .actions { display: flex; gap: 10px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  #status { color: var(--muted); font-size: 14px; }
  #status.err { color: var(--err); }
  .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .out-head h2 { font-size: 15px; margin: 0; }
  #demoNote {
    display: none; margin-bottom: 12px; padding: 9px 12px; border-radius: 8px; font-size: 14px;
    background: var(--demo-bg); border: 1px solid var(--demo-line);
  }
  #empty { color: var(--muted); padding: 24px 4px; }
  .section h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    margin: 18px 0 8px;
  }
  .section.beh h3 { color: var(--tag-beh); }
  .section.pm h3 { color: var(--tag-pm); }
  .section:first-child h3 { margin-top: 4px; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: q var(--start, 0); }
  li {
    counter-increment: q; position: relative;
    padding: 12px 12px 12px 44px; margin-bottom: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  li::before {
    content: counter(q); position: absolute; left: 12px; top: 12px;
    width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700;
    display: grid; place-items: center; color: var(--panel);
  }
  .section.beh li::before { background: var(--tag-beh); }
  .section.pm li::before { background: var(--tag-pm); }
  .q { font-weight: 600; margin: 0 0 6px; }
  .testing { margin: 0; color: var(--muted); font-size: 14px; }
  .testing b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Interview Question Generator</h1>
  <p class="sub">Paste a job description and your résumé. Claude writes ten questions this interviewer is likely to ask you — five behavioral, five program-management — and what each one is really testing.</p>

  <div class="bar">
    <div class="field">
      <label for="apiKey">Anthropic API key <span class="hint">— leave empty to see sample output</span></label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <label for="jd">Job description</label>
      <textarea id="jd" placeholder="Paste the full job posting…"></textarea>
    </div>
    <div class="card">
      <label for="resume">Résumé</label>
      <textarea id="resume" placeholder="Paste your résumé as plain text…"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="generate" class="primary">Generate questions</button>
    <span id="status"></span>
  </div>

  <div class="card">
    <div class="out-head">
      <h2>Interview questions</h2>
      <button id="copy" disabled>Copy</button>
    </div>
    <div id="demoNote"></div>
    <div id="results"><p id="empty">Your ten questions will appear here.</p></div>
  </div>
</main>

<script type="module">
const MODEL = "claude-opus-5-5";

const SYSTEM_PROMPT = `You are an experienced hiring manager and interview coach for program and project management roles.

Given a job description and a candidate's résumé, write the ten questions this interviewer is most likely to ask this specific candidate: exactly five behavioral questions and exactly five program-management questions.

Make every question specific. Behavioral questions should reference real projects, numbers, or claims from the résumé, or probe gaps between the résumé and what the role needs. Program-management questions should be scenarios drawn from the actual work described in the job description (its programs, stakeholders, constraints, scale), not generic textbook prompts.

For each question, write one or two sentences on what the interviewer is testing: the competency, and the specific concern or signal behind it for this candidate.`;

const SCHEMA = {
  type: "object",
  properties: {
    behavioral: { type: "array", items: { $ref: "#/$defs/question" } },
    program_management: { type: "array", items: { $ref: "#/$defs/question" } },
  },
  required: ["behavioral", "program_management"],
  additionalProperties: false,
  $defs: {
    question: {
      type: "object",
      properties: {
        question: { type: "string" },
        testing: { type: "string" },
      },
      required: ["question", "testing"],
      additionalProperties: false,
    },
  },
};

// ---- Sample inputs, and the canned output shown when there's no API key ----
const SAMPLE_JD = `Senior Technical Program Manager — Payments Platform
Northwind Pay · New York, NY (hybrid)

About the role
Northwind Pay processes $40B a year in card and ACH payments for 60,000 small businesses. We're moving card processing off a legacy processor onto two new processors before our current contract ends in Q3 next year. You'll own that migration end to end.

What you'll do
- Lead a cross-functional program spanning 6 engineering teams (Payments Core, Risk, Ledger, Merchant Onboarding, Mobile, Data) plus Compliance, Finance, and Support.
- Build and run the integrated plan: milestones, dependencies, risks, and a weekly operating cadence.
- Drive decisions on scope and sequencing with engineering leads and the VP of Engineering, to whom you report.
- Partner with Compliance to meet PCI DSS and card-network requirements at each cutover.
- Plan and run phased merchant cutovers with clear go/no-go criteria and rollback plans.
- Report status and risks to the executive team every two weeks.

What we're looking for
- 6+ years of program or project management in a technical environment.
- Track record delivering large migrations or platform changes across many teams.
- Comfort with ambiguity and with influencing senior engineers without direct authority.
- Experience in payments, fintech, or another regulated industry strongly preferred.
- Excellent written communication; you can explain a slipping date to a CFO.`;

const SAMPLE_RESUME = `ALEX RIVERA
New York, NY · alex.rivera@example.com

EXPERIENCE

Freightline Logistics — Senior Program Manager, Platform (2021–present)
- Led migration of 14 regional dispatch teams onto a single routing platform; completed 3 weeks ahead of plan, cutting dispatch errors 38%.
- Cut carrier/vendor onboarding from 9 weeks to 3 by redesigning the intake process and automating document checks.
- Built the program dashboard (Jira + Looker) now used by 5 other programs.
- Ran quarterly planning for 4 engineering teams (~40 engineers).

Freightline Logistics — Program Manager (2019–2021)
- Managed rollout of driver mobile app to 2,500 drivers across 3 states.
- Coordinated vendor selection for telematics provider; negotiated 12% cost reduction.

BrightPath Consulting — Associate (2017–2019)
- Supported operations-improvement engagements for retail and healthcare clients.
- Built process maps and cost models for a hospital supply-chain redesign.

EDUCATION
MBA candidate, Columbia Business School (expected 2027)
B.S. Industrial Engineering, Georgia Tech (2017)

CERTIFICATIONS
PMP (2020) · Certified ScrumMaster (2019)`;

const SAMPLE_RESULT = {
  behavioral: [
    {
      question: "At Freightline you moved 14 regional dispatch teams onto one routing platform. Tell me about the team that pushed back hardest — what did you do, and what did it cost you?",
      testing: "Influence without authority. The role needs six engineering teams to follow a plan none of them report into; they want to hear a real tactic, not just \"I built alignment.\"",
    },
    {
      question: "Tell me about a time you had to tell a senior executive that a date was going to slip. How did you frame it, and what happened next?",
      testing: "Executive communication and candor. The JD explicitly asks for someone who can explain a slipping date to a CFO; they're checking whether you escalate early with options or late with excuses.",
    },
    {
      question: "You cut vendor onboarding from 9 weeks to 3. Walk me through one decision in that project you'd make differently today.",
      testing: "Self-awareness and depth. Probing a headline number checks that you personally drove it and can reflect honestly on trade-offs.",
    },
    {
      question: "Describe a time two engineering leads disagreed on a technical approach and you were caught in the middle. How did the decision get made?",
      testing: "Conflict resolution and decision hygiene — whether you force clarity on who decides and by when, rather than picking a side or letting it drift.",
    },
    {
      question: "Your background is logistics, not payments. Tell me about a time you had to become credible in an unfamiliar, technical domain quickly.",
      testing: "Learning agility. This targets the biggest gap between your résumé and the \"payments or regulated industry preferred\" line in the JD.",
    },
  ],
  program_management: [
    {
      question: "You're starting on this processor migration: six teams, two new processors, and a contract end date that can't move. What do you do in your first 30 days?",
      testing: "Program setup — dependency mapping, finding the critical path, setting an operating cadence, and learning the teams before committing to a plan.",
    },
    {
      question: "Halfway through, the program is six weeks behind and the contract date is fixed. How do you decide what to cut or change?",
      testing: "Scope and risk trade-offs under a hard deadline — whether you reason from merchant and revenue impact and bring the VP options rather than one answer.",
    },
    {
      question: "PCI DSS and card-network sign-off are required before each cutover. How would you build Compliance into the plan so it isn't a surprise gate at the end?",
      testing: "Working in a regulated environment — pulling Compliance in early and treating their requirements as dependencies, not approvals. Also a second probe on your domain gap.",
    },
    {
      question: "What would you put on the biweekly executive status report for this program, and which single metric would you watch most closely?",
      testing: "Leading vs. lagging indicators and executive-ready reporting. Your Jira + Looker dashboard is a natural example to build on.",
    },
    {
      question: "Walk me through how you'd run a merchant cutover weekend for a payments system with zero tolerance for lost transactions.",
      testing: "Operational rigor — runbooks, go/no-go criteria, rollback triggers, Support readiness, and who has the authority to call it off.",
    },
  ],
};

const $ = (id) => document.getElementById(id);
const jdEl = $("jd"), resumeEl = $("resume"), results = $("results");
const status = $("status"), demoNote = $("demoNote");
const generateBtn = $("generate"), copyBtn = $("copy");
let current = null;

// Start with the sample loaded so the page is ready to try.
jdEl.value = SAMPLE_JD;
resumeEl.value = SAMPLE_RESUME;

function clearOutput() {
  current = null;
  results.innerHTML = `<p id="empty">Your ten questions will appear here.</p>`;
  demoNote.style.display = "none";
  copyBtn.disabled = true;
  setStatus("");
}
function setStatus(msg, isErr = false) {
  status.textContent = msg;
  status.className = isErr ? "err" : "";
}

function render(data) {
  current = data;
  results.innerHTML = "";
  const sections = [
    ["beh", "Behavioral", data.behavioral],
    ["pm", "Program management", data.program_management],
  ];
  let n = 0;
  for (const [cls, title, items] of sections) {
    const sec = document.createElement("div");
    sec.className = `section ${cls}`;
    const h = document.createElement("h3");
    h.textContent = title;
    const ol = document.createElement("ol");
    ol.style.setProperty("--start", n);
    for (const item of items) {
      const li = document.createElement("li");
      const q = document.createElement("p");
      q.className = "q";
      q.textContent = item.question;
      const t = document.createElement("p");
      t.className = "testing";
      t.innerHTML = "<b>What they're testing:</b> ";
      t.append(item.testing);
      li.append(q, t);
      ol.append(li);
    }
    n += items.length;
    sec.append(h, ol);
    results.append(sec);
  }
  copyBtn.disabled = false;
}

function asText(data) {
  let n = 0;
  const block = (title, items) =>
    `${title.toUpperCase()}\n\n` +
    items.map((it) => `${++n}. ${it.question}\n   What they're testing: ${it.testing}`).join("\n\n");
  return block("Behavioral", data.behavioral) + "\n\n" + block("Program management", data.program_management);
}

generateBtn.addEventListener("click", async () => {
  const key = $("apiKey").value.trim();
  const jd = jdEl.value.trim(), resume = resumeEl.value.trim();

  clearOutput();
  generateBtn.disabled = true;
  try {
    if (key) {
      if (!jd || !resume) { setStatus("Paste both a job description and a résumé.", true); return; }
      await generateWithClaude(key, jd, resume);
    } else {
      await showSample(jd, resume);
    }
  } finally {
    generateBtn.disabled = false;
  }
});

copyBtn.addEventListener("click", async () => {
  if (!current) return;
  await navigator.clipboard.writeText(asText(current));
  copyBtn.textContent = "Copied";
  setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
});

// ---- Demo mode: no key, so show the canned sample ----
async function showSample(jd, resume) {
  const isSample = jd === SAMPLE_JD.trim() && resume === SAMPLE_RESUME.trim();
  demoNote.textContent = isSample
    ? "Sample output — no API key entered. Paste a key above to generate questions for your own JD and résumé."
    : "Sample output for the built-in Northwind Pay example — your own JD and résumé aren't used without an API key.";
  demoNote.style.display = "block";
  setStatus("Generating…");
  await sleep(700);
  render(SAMPLE_RESULT);
  setStatus("Done (sample).");
}

// ---- Live mode: call Claude from the browser with the user's key ----
async function generateWithClaude(apiKey, jd, resume) {
  setStatus("Connecting…");
  let Anthropic;
  try {
    ({ default: Anthropic } = await import("https://esm.sh/@anthropic-ai/sdk"));
  } catch {
    setStatus("Couldn't load the Anthropic SDK — check your internet connection.", true);
    return;
  }

  // The key goes straight from this page to api.anthropic.com; it's never stored.
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });

  const userMessage =
`<job_description>
${jd}
</job_description>

<resume>
${resume}
</resume>

Write the ten interview questions.`;

  try {
    setStatus("Generating… this usually takes 20–40 seconds.");
    const message = await client.beta.messages.create({
      model: MODEL,
      max_tokens: 16000,
      output_config: {
        effort: "medium",
        format: { type: "json_schema", schema: SCHEMA },
      },
      // If a safety classifier declines, retry on a fallback model within the same call.
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: userMessage }],
    });

    if (message.stop_reason === "refusal") {
      setStatus("Claude declined to generate questions for this input.", true);
      return;
    }
    if (message.stop_reason === "max_tokens") {
      setStatus("Stopped early — the output hit the length limit. Try again.", true);
      return;
    }
    const text = message.content.filter((b) => b.type === "text").map((b) => b.text).join("");
    render(JSON.parse(text));
    setStatus("Done.");
  } catch (err) {
    if (err instanceof SyntaxError) setStatus("Got an unreadable response from Claude. Try again.", true);
    else if (err instanceof Anthropic.AuthenticationError) setStatus("That API key was rejected. Check it and try again.", true);
    else if (err instanceof Anthropic.PermissionDeniedError) setStatus("This key doesn't have access to that model.", true);
    else if (err instanceof Anthropic.RateLimitError) setStatus("Rate limited — wait a moment and try again.", true);
    else if (err instanceof Anthropic.BadRequestError) setStatus(`Request rejected: ${err.message}`, true);
    else if (err instanceof Anthropic.APIError) setStatus(`API error${err.status ? " " + err.status : ""}: ${err.message}`, true);
    else setStatus(`Something went wrong: ${err.message ?? err}`, true);
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
</script>
</body>
</html>
